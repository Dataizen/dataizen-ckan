# Configuration Apache pour MapServer WMS/WFS

# Activer le module MapServer
LoadModule mapserver_module /usr/lib/apache2/modules/mod_mapserver.so

# Configuration pour les fichiers .map
<FilesMatch "\.map$">
    SetHandler mapserver
</FilesMatch>

# Alias pour les mapfiles
Alias /mapfiles /mapserver/mapfiles

# Configuration du répertoire mapfiles
<Directory /mapserver/mapfiles>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Proxy pour WMS/WFS (si nécessaire)
# Les requêtes WMS/WFS seront gérées directement par MapServer via mod_mapserver




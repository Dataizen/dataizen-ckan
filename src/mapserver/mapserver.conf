# Configuration Apache pour MapServer WMS/WFS
# Ce fichier est chargé via a2enconf mapserver
# Note: Les modules Apache sont chargés via a2enmod dans le Dockerfile

# Configuration du répertoire CGI
<Directory /usr/lib/cgi-bin>
    Options +ExecCGI
    AddHandler cgi-script .cgi .sh
    Require all granted
</Directory>

# Configuration pour les requêtes WMS/WFS via CGI
# Les requêtes seront: /wms?map=/mapserver/mapfiles/nom.map&...
ScriptAlias /wms /usr/lib/cgi-bin/mapserv
ScriptAlias /wfs /usr/lib/cgi-bin/mapserv
ScriptAlias /wmts /usr/lib/cgi-bin/mapserv

# Configuration du répertoire mapfiles
<Directory /mapserver/mapfiles>
    Options Indexes FollowSymLinks
    Require all granted
</Directory>

# Configuration du répertoire data
<Directory /mapserver/data>
    Options Indexes FollowSymLinks
    Require all granted
</Directory>

# Configuration du répertoire logs
<Directory /mapserver/logs>
    Options Indexes FollowSymLinks
    Require all granted
</Directory>


[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:ckan]
command=/docker-entrypoint.sh
directory=/srv/app
environment=CKAN_INI="/srv/app/ckan.ini",PYTHONUNBUFFERED="1",PYGEOAPI_RESTART_CMD="/srv/app/restart-pygeoapi.sh"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/ckan.out.log
stderr_logfile=/tmp/ckan.err.log
startretries=10
stopsignal=TERM
stopwaitsecs=20

# NOTE: pygeoapi est maintenant dans un service Docker séparé
# Il n'est plus géré par supervisor pour éviter les conflits de contexte WSGI

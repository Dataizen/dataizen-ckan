[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisord.d/*.conf

[program:ckan]
command=/srv/app/start_ckan_with_logs.sh
directory=/srv/app
environment=CKAN_INI="/srv/app/ckan.ini",PYTHONUNBUFFERED="1",PYGEOAPI_RESTART_CMD="/srv/app/restart-pygeoapi.sh"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
startretries=10
stopsignal=TERM
stopwaitsecs=20

# NOTE: pygeoapi est maintenant dans un service Docker séparé
# Il n'est plus géré par supervisor pour éviter les conflits de contexte WSGI

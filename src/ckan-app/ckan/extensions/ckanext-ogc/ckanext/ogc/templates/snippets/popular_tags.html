{% set popular_tags = h.get_popular_tags(limit=10) %}
{% if popular_tags %}
  <section class="popular-tags-section">
    <h2 class="section-title">{{ _('Tags populaires') }}</h2>
    <div class="tags-cloud">
      {% for tag in popular_tags %}
        <a href="{{ h.url_for('dataset.search', tags=tag.name) }}" 
           class="tag-item" 
           title="{{ tag.name }} ({{ tag.count }} dataset{{ 's' if tag.count > 1 else '' }})">
          {{ tag.name }}
          <span class="tag-count">({{ tag.count }})</span>
        </a>
      {% endfor %}
    </div>
  </section>

  <style>
    .popular-tags-section {
      margin: 2rem 0;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #333;
    }
    .tags-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .tag-item {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      text-decoration: none;
      color: #495057;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .tag-item:hover {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(0,123,255,0.3);
    }
    .tag-count {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-left: 0.25rem;
    }
  </style>
{% endif %}

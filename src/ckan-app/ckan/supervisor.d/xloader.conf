[program:xloader]
# IMPORTANT: Ne PAS utiliser --burst (le worker doit rester actif en continu)
# Le worker attend que Redis soit disponible avant de démarrer
# CKAN utilisera la queue configurée dans ckan.jobs.queue_name (par défaut: default)
# On spécifie explicitement "default" pour que CKAN préfixe automatiquement
# NOTE: Le patch 21-patch-xloader-init-ckan.sh est désactivé (renommé DISABLED-)
command=/bin/bash -lc "echo '[XLOADER] Starting xloader worker...'; until timeout 2 bash -lc 'cat < /dev/null > /dev/tcp/redis/6379'; do echo '[xloader] waiting for redis...'; sleep 2; done; echo '[XLOADER] Redis is ready'; bash /srv/app/scripts/wait-datastore.sh; export CKAN_INI=/srv/app/ckan.ini; export CKAN_RQ_TRACE_TEARDOWN=1; export CKAN_RQ_TRACE_EXECUTE_JOB=1; export CKAN_RQ_ANTI_SUICIDE=1; export CKAN_RQ_DISABLE_INTERMEDIATE=1; exec ckan -c /srv/app/ckan.ini jobs worker default"
environment=CKAN_INI="/srv/app/ckan.ini",CKAN_RQ_TRACE_TEARDOWN="1",CKAN_RQ_TRACE_EXECUTE_JOB="1",CKAN_RQ_ANTI_SUICIDE="1",CKAN_RQ_DISABLE_INTERMEDIATE="1"
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=999
# Augmenter startsecs pour donner plus de temps au worker de démarrer et traiter un job
# Le worker doit rester actif en continu, donc startsecs peut être plus élevé
# Si le worker crash avant 30 secondes, Supervisor le redémarre
startsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=600
# Le worker devrait rester actif en continu, donc s'il se termine, c'est une erreur
# Supervisor redémarrera automatiquement grâce à autorestart=true 

[logger_ckanext_xloader]
level = DEBUG
handlers = console
qualname = ckanext.xloader
propagate = 0

[logger_ckan_datastore]
level = DEBUG
handlers = console
qualname = ckan.datastore
propagate = 0

[logger_root]
level = WARNING
handlers = console
qualname = root
propagate = 0
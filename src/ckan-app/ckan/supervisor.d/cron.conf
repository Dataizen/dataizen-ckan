[program:cron]
command=/srv/app/scripts/start-cron.sh
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=false
startsecs=5
stopwaitsecs=10
priority=200
# Ne pas redémarrer automatiquement si cron échoue (seteuid)
# car cela causerait une boucle infinie de redémarrages



[program:ragworker]
# Worker RQ DÉDIÉ à la réindexation RAG (queue « rag »).
# Séparé du worker xloader (queue « default ») : la réindexation, non critique et
# parfois lente (appel au service dtz-rag, embeddings), ne retarde plus l'import
# datastore ni les autres jobs. Le plugin ckanext-rag enfile reindex_dataset_job
# sur la queue « rag » (avec débounce pour collapser les rafales d'ingestion).
# Ne PAS utiliser --burst (le worker doit rester actif en continu).
command=/bin/bash -lc "echo '[RAGWORKER] Starting rag worker...'; until timeout 2 bash -lc 'cat < /dev/null > /dev/tcp/redis/6379'; do echo '[ragworker] waiting for redis...'; sleep 2; done; echo '[RAGWORKER] Redis is ready'; bash /srv/app/scripts/wait-datastore.sh; export CKAN_INI=/srv/app/ckan.ini; export CKAN_RQ_TRACE_TEARDOWN=1; export CKAN_RQ_TRACE_EXECUTE_JOB=1; export CKAN_RQ_ANTI_SUICIDE=1; export CKAN_RQ_DISABLE_INTERMEDIATE=1; exec ckan -c /srv/app/ckan.ini jobs worker rag"
environment=CKAN_INI="/srv/app/ckan.ini",CKAN_RQ_TRACE_TEARDOWN="1",CKAN_RQ_TRACE_EXECUTE_JOB="1",CKAN_RQ_ANTI_SUICIDE="1",CKAN_RQ_DISABLE_INTERMEDIATE="1"
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=999
startsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=600

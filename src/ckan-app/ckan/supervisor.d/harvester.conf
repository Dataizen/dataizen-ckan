command=/bin/bash -lc 'until timeout 2 bash -lc "cat < /dev/null > /dev/tcp/redis/6379"; do echo "[harvester-fetch] waiting for redis..."; sleep 2; done; exec ckan -c /srv/app/ckan.ini harvester fetch-consumer'

# Planificateur des moissonnages récurrents (alternatif au cron, plus fiable en Docker)
# Exécute "ckan harvester run" toutes les heures pour lancer les sources dont next_run <= NOW()
[program:harvest-scheduler]
command=/bin/bash -lc 'cd /srv/app && while true; do echo "[harvest-scheduler] $(date -Iseconds) running harvester run..."; ckan -c /srv/app/ckan.ini harvester run; sleep 3600; done'
numprocs=1
directory=/srv/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=999
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=150
[program:harvester-gather]
command=/bin/bash -lc 'until timeout 2 bash -lc "cat < /dev/null > /dev/tcp/redis/6379"; do echo "[harvester-gather] waiting for redis..."; sleep 2; done; exec ckan -c /srv/app/ckan.ini harvester gather-consumer'
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=999
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=600
priority=100


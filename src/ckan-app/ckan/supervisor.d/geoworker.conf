[program:geoworker]
# Worker RQ DÉDIÉ à la géométrisation cartographique (queue « geo »).
# Séparé du worker xloader : un gros job de géométrisation (millions de lignes,
# plusieurs dizaines de minutes) ne bloque plus ni l'import xloader, ni les autres
# jobs géo. Le plugin ogc enfile dtz_geo_process_job sur la queue « geo ».
# Ne PAS utiliser --burst (le worker doit rester actif en continu).
command=/bin/bash -lc "echo '[GEOWORKER] Starting geo worker...'; until timeout 2 bash -lc 'cat < /dev/null > /dev/tcp/redis/6379'; do echo '[geoworker] waiting for redis...'; sleep 2; done; echo '[GEOWORKER] Redis is ready'; bash /srv/app/scripts/wait-datastore.sh; export CKAN_INI=/srv/app/ckan.ini; export CKAN_RQ_TRACE_TEARDOWN=1; export CKAN_RQ_TRACE_EXECUTE_JOB=1; export CKAN_RQ_ANTI_SUICIDE=1; export CKAN_RQ_DISABLE_INTERMEDIATE=1; exec ckan -c /srv/app/ckan.ini jobs worker geo"
environment=CKAN_INI="/srv/app/ckan.ini",CKAN_RQ_TRACE_TEARDOWN="1",CKAN_RQ_TRACE_EXECUTE_JOB="1",CKAN_RQ_ANTI_SUICIDE="1",CKAN_RQ_DISABLE_INTERMEDIATE="1"
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=999
startsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=600

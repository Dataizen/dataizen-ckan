{% ckan_extends %}

{% block login_button %}
  <div class="login-buttons">
    <!-- Bouton SSO Keycloak -->
    <a href="{{ h.url_for('user.sso') }}" class="btn btn-primary sso-login-btn">
      <i class="fa fa-key"></i> SSO Login
    </a>
    
    <!-- Bouton de déconnexion SSO (si connecté via SSO) -->
    {% if c.userobj and c.userobj.plugin_extras and c.userobj.plugin_extras.get('idp') == 'keycloak' %}
      <a href="{{ h.url_for('user.sso_logout') }}" class="btn btn-warning sso-logout-btn">
        <i class="fa fa-sign-out"></i> SSO Logout
      </a>
    {% endif %}
    
    <!-- Bouton de connexion CKAN classique -->
    <button class="btn btn-default" type="submit" name="login">
      <i class="fa fa-user"></i> {{ _('Log in') }}
    </button>
  </div>
{% endblock %}

{% block styles %}
  {{ super() }}
  <style>
    .login-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .sso-login-btn {
      background-color: #007bff;
      border-color: #007bff;
    }
    
    .sso-login-btn:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }
    
    .sso-logout-btn {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #212529;
    }
    
    .sso-logout-btn:hover {
      background-color: #e0a800;
      border-color: #d39e00;
    }
    
    @media (max-width: 768px) {
      .login-buttons {
        flex-direction: column;
      }
      
      .login-buttons .btn {
        width: 100%;
        margin-bottom: 5px;
      }
    }
  </style>
{% endblock %}
